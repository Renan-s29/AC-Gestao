<div class="prototype-frame">
  <aside class="sidebar">
    <div class="side-brand">AC-Gestão</div>
    <nav class="side-menu">
      @for (item of itensVisiveis(); track item.label) {
        <a [routerLink]="item.path" routerLinkActive="active-link">
          <mat-icon>{{ item.icon }}</mat-icon>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>
  </aside>

  <section class="work-area">
    <header class="wire-topbar">
      <button class="hamb" type="button" aria-label="menu">
        <mat-icon>menu</mat-icon>
      </button>
      <div class="global-search">
        <mat-icon>search</mat-icon>
        <input
          #busca
          type="text"
          placeholder="Busque por Associados"
          (keyup.enter)="buscarAssociado(busca.value)"
        />
      </div>
      <div class="user-area">
        <mat-icon>person</mat-icon>
        @if (usuario(); as u) {
          <span>{{ u.nome }}</span>
        } @else {
          <span>Tesoureiro</span>
        }
        <mat-icon>expand_more</mat-icon>
      </div>
      <button mat-button type="button" (click)="sair()">Sair</button>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </section>
</div>
