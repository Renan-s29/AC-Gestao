<div class="ac-page">
  <h2>Relatórios</h2>
  <p class="ac-muted">Exportação de faturamentos com filtros — LGPD: limitar campos e finalidade do relatório.</p>

  <mat-card>
    <div [formGroup]="form" class="grid">
      <mat-form-field appearance="outline">
        <mat-label>Data início</mat-label>
        <input matInput type="date" formControlName="data_inicio" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Data fim</mat-label>
        <input matInput type="date" formControlName="data_fim" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Status</mat-label>
        <mat-select formControlName="status">
          <mat-option value="">(todos)</mat-option>
          <mat-option value="pendente">pendente</mat-option>
          <mat-option value="pago">pago</mat-option>
        </mat-select>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Associado (id)</mat-label>
        <input matInput formControlName="associado_id" />
      </mat-form-field>
    </div>

    <div class="actions">
      <button mat-flat-button color="primary" type="button" (click)="baixarExcel()">
        <mat-icon>table_view</mat-icon>
        Exportar Excel
      </button>
      <button mat-stroked-button color="primary" type="button" (click)="baixarPdf()">
        <mat-icon>picture_as_pdf</mat-icon>
        Exportar PDF
      </button>
    </div>

    @if (msg()) {
      <p class="erro">{{ msg() }}</p>
    }
  </mat-card>
</div>
