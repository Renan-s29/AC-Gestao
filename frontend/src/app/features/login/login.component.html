<div class="login-wrap">
  <mat-card class="login-card">
    <div class="login-brand">
      <div class="logo">AC</div>
      <div>
        <h1>AC-Gestão</h1>
        <p class="ac-muted">Protótipo para modernização da associação comercial</p>
      </div>
    </div>

    <form [formGroup]="form" (ngSubmit)="entrar()">
      <mat-form-field appearance="outline" class="full">
        <mat-label>E-mail</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="username" />
      </mat-form-field>
      <mat-form-field appearance="outline" class="full">
        <mat-label>Senha</mat-label>
        <input matInput type="password" formControlName="senha" autocomplete="current-password" />
      </mat-form-field>

      @if (erro()) {
        <div class="erro">{{ erro() }}</div>
      }

      <button mat-flat-button color="primary" class="full" type="submit" [disabled]="carregando()">
        <mat-icon>login</mat-icon>
        Entrar
      </button>
    </form>

    <p class="hint ac-muted">
      LGPD: dados exibidos neste protótipo são fictícios. Em produção, aplicar minimização, controle de acesso e
      criptografia conforme mapeamento de dados pessoais.
    </p>
  </mat-card>
</div>
